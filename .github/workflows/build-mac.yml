name: Build macOS

on:
  push:
    branches:
      - sju
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install

      - name: Create credentials.json from secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Build Python executable
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller problem_cutter.spec --clean
          mkdir -p src/python_dist
          cp -r dist/problem_cutter src/python_dist/
          deactivate

      - name: Build Electron app for macOS
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create README
        run: |
          cat > release/mac-arm64/README.txt << 'EOF'
          【ProblemTestMaker 설치 방법】

          터미널을 열고 (⌘ + Space → "터미널" 입력) 아래 명령어를 복사해서 실행하세요:

          cd ~/Downloads && xattr -cr ProblemTestMaker.app && cp -R ProblemTestMaker.app /Applications/

          그 다음 Applications 폴더에서 ProblemTestMaker를 실행하세요.

          EOF

      - name: Create zip
        run: |
          cd release/mac-arm64
          zip -r ../ProblemTestMaker-macOS.zip ProblemTestMaker.app README.txt

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/ProblemTestMaker-macOS.zip
          retention-days: 7
