name: Build macOS

on:
  push:
    branches:
      - sju
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm install

      - name: Build Python executable
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller problem_cutter.spec --clean
          mkdir -p src/python_dist
          cp -r dist/problem_cutter src/python_dist/
          deactivate

      - name: Build Electron app for macOS
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create DMG manually
        run: |
          mkdir -p release/dmg
          cp -R release/mac-arm64/ProblemTestMaker.app release/dmg/
          hdiutil create -volname "ProblemTestMaker" -srcfolder release/dmg -ov -format UDZO release/ProblemTestMaker.dmg

      - name: List build output
        run: ls -lh release/

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/ProblemTestMaker.dmg
          retention-days: 7
